name: GZCTF 构建、测试与发布

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "从 main 手动部署到 gzctf-server"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: registry.cn-hangzhou.aliyuncs.com/sf_project/gzctf

jobs:
  verify:
    name: 后端、前端与镜像验证
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 pnpm
        run: npm install --global pnpm@11

      - name: 还原并构建后端
        working-directory: src
        run: |
          set -eu
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: 运行单元测试
        working-directory: src
        run: dotnet test GZCTF.Test/GZCTF.Test.csproj --no-build --configuration Release

      - name: 准备集成测试容器镜像
        run: |
          set -eu
          docker info >/dev/null
          docker image inspect docker.io/library/busybox:latest >/dev/null 2>&1 || \
            docker pull docker.io/library/busybox:latest
          docker build \
            --file src/GZCTF.Integration.Test/Assets/Echo/Dockerfile \
            --tag gzctf-integration/echo:latest \
            src/GZCTF.Integration.Test/Assets/Echo

      - name: 运行集成测试
        working-directory: src
        env:
          GZCTF_INTEGRATION_TEST_MODE: local
        run: dotnet test GZCTF.Integration.Test/GZCTF.Integration.Test.csproj --no-build --configuration Release

      - name: 检查并构建前端
        working-directory: src/GZCTF/ClientApp
        run: |
          set -eu
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: 发布 linux/amd64 文件
        working-directory: src
        env:
          VITE_APP_BUILD_TIMESTAMP: ${{ github.event.repository.updated_at }}
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_GIT_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          dotnet publish GZCTF/GZCTF.csproj --configuration Release \
            --output GZCTF/publish/linux/amd64 --runtime linux-x64 \
            --no-self-contained /p:PublishReadyToRun=true

      - name: 验证 Docker 镜像构建
        run: |
          set -eu
          docker info >/dev/null
          docker build --platform linux/amd64 --file src/GZCTF/Dockerfile \
            --tag gzctf-ci:${GITHUB_SHA} src/GZCTF
          docker image inspect gzctf-ci:${GITHUB_SHA} --format '镜像已构建: {{index .RepoTags 0}}'

  publish:
    name: 发布 main 镜像
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: 安装 Node.js 与 pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 pnpm
        run: npm install --global pnpm@11

      - name: 发布 linux/amd64 文件
        working-directory: src
        env:
          VITE_APP_BUILD_TIMESTAMP: ${{ github.event.repository.updated_at }}
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_GIT_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          dotnet restore
          dotnet publish GZCTF/GZCTF.csproj --configuration Release \
            --output GZCTF/publish/linux/amd64 --runtime linux-x64 \
            --no-self-contained /p:PublishReadyToRun=true

      - name: 构建并推送阿里云 ACR
        env:
          ALIYUN_CR_USERNAME: ${{ secrets.ALIYUN_CR_USERNAME }}
          ALIYUN_CR_PASSWORD: ${{ secrets.ALIYUN_CR_PASSWORD }}
        run: |
          set -eu
          test -n "${ALIYUN_CR_USERNAME:-}"
          test -n "${ALIYUN_CR_PASSWORD:-}"
          sha8="$(printf '%s' "${GITHUB_SHA}" | cut -c 1-8)"
          image="${IMAGE_REPOSITORY}:prod-${sha8}"
          printf '%s' "${ALIYUN_CR_PASSWORD}" | docker login registry.cn-hangzhou.aliyuncs.com \
            --username "${ALIYUN_CR_USERNAME}" --password-stdin
          docker build --platform linux/amd64 --file src/GZCTF/Dockerfile \
            --tag "${image}" src/GZCTF
          docker push "${image}"
          echo "已发布 ${image}"

  deploy:
    name: 手动部署生产
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production
    runs-on: k8s
    needs: publish
    timeout-minutes: 10
    steps:
      - name: 更新镜像并等待 Ready
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          set -eu
          test -n "${KUBECONFIG_DATA:-}"
          mkdir -p "$HOME/.kube"
          printf '%s\n' "${KUBECONFIG_DATA}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"

          sha8="$(printf '%s' "${GITHUB_SHA}" | cut -c 1-8)"
          next_image="${IMAGE_REPOSITORY}:prod-${sha8}"
          previous_image="$(kubectl -n gzctf-server get deployment gzctf \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="gzctf")].image}')"
          test -n "${previous_image}"

          kubectl -n gzctf-server set image deployment/gzctf gzctf="${next_image}"
          if ! kubectl -n gzctf-server rollout status deployment/gzctf --timeout=5m; then
            echo "发布失败，恢复 ${previous_image}" >&2
            kubectl -n gzctf-server set image deployment/gzctf gzctf="${previous_image}"
            kubectl -n gzctf-server rollout status deployment/gzctf --timeout=5m
            exit 1
          fi

          kubectl -n gzctf-server get deployment gzctf -o wide
          kubectl -n gzctf-server get pods -l app=gzctf -o wide
