apiVersion: v1
kind: ServiceAccount
metadata:
  name: gzctf-runtime
  namespace: gzctf-server
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: server
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gzctf-runtime-namespace-reader
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gzctf-runtime-namespace-reader
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: server
subjects:
  - kind: ServiceAccount
    name: gzctf-runtime
    namespace: gzctf-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gzctf-runtime-namespace-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gzctf-runtime
  namespace: gzctf-challenges
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: challenge-runtime
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gzctf-runtime
  namespace: gzctf-challenges
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: challenge-runtime
subjects:
  - kind: ServiceAccount
    name: gzctf-runtime
    namespace: gzctf-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gzctf-runtime
