apiVersion: v1
kind: ConfigMap
metadata:
  name: gzctf-sso-config
  namespace: gzctf-server
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: identity
data:
  GZCTF_Sso__Enabled: "false"
  GZCTF_Sso__Authority: "https://sso.imxbt.cn/realms/sftian"
  GZCTF_Sso__ClientId: "gzctf"
  GZCTF_Sso__LocalAuthenticationEnabled: "true"
  GZCTF_Sso__LocalCredentialManagementEnabled: "true"
  GZCTF_AccountPolicy__AllowRegister: "true"
  GZCTF_ConnectionStrings__RedisCache: "gzctf-garnet:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: gzctf-sso-secret
  namespace: gzctf-server
  labels:
    app.kubernetes.io/name: gzctf
    app.kubernetes.io/component: identity
type: Opaque
